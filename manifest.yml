display_information:
  name: Tulle Ops
  description: Flips vendor visibility in Xano from a Slack reaction.
  background_color: "#0A3D24"
features:
  bot_user:
    display_name: Tulle Ops
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
      - reactions:read
      - reactions:write
      - app_mentions:read
settings:
  event_subscriptions:
    # Replace with your Railway domain after first deploy.
    request_url: https://YOUR-APP.up.railway.app/slack/events
    bot_events:
      - reaction_added
      - reaction_removed
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
