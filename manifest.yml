display_information:
  name: Tulle Ops
  description: Flips vendor visibility in Xano from a Slack reaction.
  background_color: "#0A3D24"
features:
  bot_user:
    display_name: Tulle Ops
    always_online: true
  slash_commands:
    - command: /tulle
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: Propose and approve vendor data edits
      usage_hint: edit V4341 Description = New blurb
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
      - reactions:read
      - reactions:write
      - app_mentions:read
      - commands
settings:
  interactivity:
    # Bolt's ExpressReceiver serves events, slash commands AND interactivity on
    # the SAME path, so this is deliberately identical to the event URL below.
    is_enabled: true
    request_url: https://tulle-slackbot-production.up.railway.app/slack/events
  event_subscriptions:
    request_url: https://tulle-slackbot-production.up.railway.app/slack/events
    bot_events:
      - reaction_added
      - reaction_removed
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
