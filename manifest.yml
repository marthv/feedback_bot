display_information:
  name: Tulle Ops
  description: Flips vendor visibility in Xano from a Slack reaction.
  background_color: "#0A3D24"
features:
  bot_user:
    display_name: Tulle Ops
    always_online: true
  slash_commands:
    - command: /tulle
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: What this bot does, and every command
      usage_hint: about | status | edit | pending
      should_escape: false
    - command: /tulle-edit
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: Propose a vendor data change (needs approval)
      usage_hint: V4341 State = South Carolina
      should_escape: false
    - command: /tulle-hide
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: Hide a vendor from search
      usage_hint: V4341
      should_escape: false
    - command: /tulle-show
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: Put a hidden vendor back in search
      usage_hint: V4341
      should_escape: false
    - command: /tulle-pending
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: Proposed changes waiting for approval
      should_escape: false
    - command: /tulle-applied
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: Changes already applied, and who approved them
      should_escape: false
    - command: /tulle-status
      url: https://tulle-slackbot-production.up.railway.app/slack/events
      description: Current settings and whether Xano is reachable
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
      - reactions:read
      - reactions:write
      - app_mentions:read
      - commands
settings:
  interactivity:
    # Bolt's ExpressReceiver serves events, slash commands AND interactivity on
    # the SAME path, so this is deliberately identical to the event URL below.
    is_enabled: true
    request_url: https://tulle-slackbot-production.up.railway.app/slack/events
  event_subscriptions:
    request_url: https://tulle-slackbot-production.up.railway.app/slack/events
    bot_events:
      - reaction_added
      - reaction_removed
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
